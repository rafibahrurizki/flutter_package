version: 0.2.2
homepage: https://ad.auliyaa.com
repository: https://github.com/dhiyaaulauliyaa/scroll_datetime_picker
issue_tracker: https://github.com/dhiyaaulauliyaa/scroll_datetime_picker/issues
topics:
  - widget
  - datetime
  - picker
platforms:
  android:
  ios:
  linux:
  macos:
  web:
  windows:
exclude:
 - docs/**

environment:
