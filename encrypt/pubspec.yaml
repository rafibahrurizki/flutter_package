name: encrypt
version: 5.0.4
description: A set of high-level APIs over PointyCastle for two-way cryptography.
repository: https://github.com/leocavalcante/encrypt

executables:
  secure-random:

environment:
  sdk: '>=3.10.0 <4.0.0'

dependencies:
  args: ^2.7.0
  asn1lib: ^1.6.5
  clock: ^1.1.3
  crypto: ^3.0.7
  pointycastle: ^4.0.0

dev_dependencies:
  lints: ^6.1.0
  test: ^1.32.0

false_secrets:
 - /test/*.pem
